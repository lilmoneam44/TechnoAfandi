name: Temporary Cargo Lock Reconciliation

on:
  push:
    branches:
      - fix/cargo-lock-version-1.2.20

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve manifest and refresh Cargo.lock
        run: cargo metadata --format-version 1 --manifest-path src-tauri/Cargo.toml > $null

      - name: Commit the Cargo-generated lockfile
        shell: pwsh
        run: |
          git diff -- src-tauri/Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(rust): regenerate Cargo.lock for current manifest"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          } else {
            Write-Host "Cargo.lock is already synchronized."
          }

      - name: Verify lockfile is now stable
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
