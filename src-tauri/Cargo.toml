[package]
name = "TechnoAfandi-FC"
version = "1.2.20"
description = "Techno Afandi FC27 Tool Desktop Backend"
authors = ["lilmoneam44"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.13.1"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
quick-xml = "0.36"
regex = "1"
open = "5"
notify = "6"
memexec = "0.2"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
