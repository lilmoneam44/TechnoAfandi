<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title data-i18n="app.title">Techno Afandi – FC 27 Activation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>

  <!-- Custom Desktop Titlebar -->
  <header class="titlebar">
    <div class="brand-badge">
      <button class="btn-diag-link" type="button" data-action="goBack" style="font-size:14px;color:#FFF;" title="رجوع للرئيسية">
        <i class="ti ti-arrow-right"></i>
      </button>
      <span>TECHNO AFANDI</span>
      <span class="fc-tag">ACTIVATION</span>
    </div>
    <div class="controls">
      <button class="global-lang-toggle" type="button" data-action="toggleLanguage">EN / AR</button>
    </div>
  </header>

  <main class="app-container">
    <div class="pitch-lines-bg" aria-hidden="true"></div>

    <section class="hero-card">
      <div class="hero-content">
        <h1 data-i18n="nav.version">التفعيل والتحضير للتشغيل</h1>
        <p id="activation-status-text" data-i18n="app.status.ready">جاهز لبدء عملية التفعيل</p>
      </div>
    </section>

    <!-- Progress Card -->
    <section class="mode-card" style="cursor:default;flex-direction:column;align-items:stretch;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
        <span style="font-size:12px;color:var(--text-muted);">نسبة الإنجاز:</span>
        <span id="progress-percent" style="font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--ea-green);">0%</span>
      </div>
      <div style="height:8px;background:var(--pitch-surface-raised);border-radius:4px;overflow:hidden;border:1px solid var(--pitch-border);">
        <div id="progress-bar-fill" style="width:0%;height:100%;background:var(--ea-green);transition:width 0.2s ease;"></div>
      </div>
    </section>

    <!-- Controls Row -->
    <section class="actions-row">
      <button class="btn-primary-action" id="btn-start-activation" data-action="startActivation">
        <i class="ti ti-play"></i>
        <span data-i18n="btn.launch">بدء التفعيل</span>
      </button>
      <button class="btn-quick-launch" id="btn-pause" data-action="togglePause" disabled>
        <span data-i18n="btn.pause">إيقاف مؤقت</span>
      </button>
      <button class="global-lang-toggle" id="btn-cancel" data-action="cancelActivation" disabled style="padding:0 14px;">
        <span data-i18n="btn.cancel">إلغاء</span>
      </button>
    </section>
  </main>

  <!-- Cancel Confirmation Modal -->
  <div class="modal-overlay" id="cancel-modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 data-i18n="modal.cancel.confirm">تأكيد إلغاء العملية</h3>
      </div>
      <div class="modal-body">
        <p>هل أنت متأكد من رغبتك في إيقاف عملية التفعيل وإلغاء التحميل الجاري؟</p>
      </div>
      <div class="modal-footer">
        <button class="global-lang-toggle" data-action="closeModal" data-i18n="btn.resume">استمرار</button>
        <button class="btn-primary-action" style="background:var(--error-red);color:#FFF;padding:6px 14px;font-size:12px;" data-action="submitCancelChoice" data-choice="abort" data-i18n="btn.cancel">نعم، إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Result Modal Dialog -->
  <div class="modal-overlay" id="result-modal" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="result-title">...</h3>
      </div>
      <div class="modal-body">
        <p id="result-message">...</p>
      </div>
      <div class="modal-footer">
        <button class="btn-primary-action" style="padding:6px 14px;font-size:12px;" data-action="closeResultModal" data-i18n="btn.close">إغلاق</button>
      </div>
    </div>
  </div>

  <script type="module" src="scripts/version.js"></script>
</body>
</html>
